# Allow read and write for courses calendar to update user
[principal_update]
user: public
collection: public
permissions: RW

[calendar_write]
user: public
collection: public/[^/]+
permissions: rw

# Allow Reading of courses calendar for all users
[principal_public]
user: .+
collection: public
permissions: R

[calendar_read]
user: .+
collection: public/[^/]+
permissions: r
