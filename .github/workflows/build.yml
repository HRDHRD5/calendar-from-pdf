on: 
  push:
    tags:
      - '[0-9].[0-9]+.?[0-9]?'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to registry
      uses: docker/login-action@v3
      with:
        username: hrdhrd5
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build
      uses: docker/build-push-action@v6
      with:
        file: Dockerfile
        push: true
        tags: |
          hrdhrd5/calendar-from-pdf:${{ github.ref_name }}
          hrdhrd5/calendar-from-pdf:latest
